    descriptions:
    - location_id: 2041
      expected_name: Cloud City
      expected_description: Williamsburg board game café offering hundreds of games, snacks, drinks, and a gaming community.
      description: Artist-run arts and performance space at 85 North 1st Street in Williamsburg, hosting theater, art exhibitions, comedy, music, film screenings, and community gatherings.
      source: https://www.cloudcity.nyc/about.html
    - location_id: 2040
      expected_name: The Peoples' Voice Cafe
      expected_description: Volunteer-run progressive coffeehouse at Judson Memorial Church since 1979 — folk, blues, jazz, spoken word, theater, and dance with a social-justice focus.
      description: Volunteer-run concert collective founded in 1979, presenting folk, blues, jazz, spoken word, theater, and dance with a social-justice focus. Its performances have been held in Judson Memorial Church's Assembly Hall at 239 Thompson Street since 2021.
      source: https://peoplesvoicecafe.org/2021fall.html
    - location_id: 7543
      expected_name: iBoatNYC
      expected_description: An intimate East Williamsburg loft and event space at 327 Stagg St in Brooklyn, hosting after-hours house and techno parties, DJ sets, and underground dance events.
      description: Event address at 327 Stagg Street in East Williamsburg, used for independently promoted after-hours electronic music parties. iBoatNYC is an organizer that has held events here, not the name of the physical venue.
      source: https://www.eventbrite.com/e/juany-bravo-afters-brooklyn-nyc-tickets-1991707934046
    - location_id: 2744
      expected_name: 590 E 83rd St
      expected_description: Upper East Side venue hosting private events and programming including documentary film screenings, educational gatherings, and community functions in the Yorkville neighborhood.
      description: The Brearley School’s building at 590 East 83rd Street on the Upper East Side. This school building hosts educational programs, assemblies, performances, and community events; it is separate from the school’s nearby 610 East 83rd Street building.
      source: https://www.brearley.org/contact/
    - location_id: 8340
      expected_name: 250 Broome St
      expected_description: A Lower East Side building on Broome Street whose loft space hosts independent parties, pop-ups and small gatherings.
      description: T.W.I.N. (That’s What I Need) is a clothing boutique at 250 Broome Street on the Lower East Side. The shop offers clothing, accessories, styling appointments, and in-store events.
      source: https://www.twin.nyc/pages/contact
    - location_id: 8588
      expected_name: 68 White Street
      expected_description: A Tribeca event space used for members-only wellness gatherings.
      description: Moonrise is a wellness clubhouse and social gathering space at 68 White Street in Tribeca, hosting workshops, sound sessions, tea gatherings, and community events. It is distinct from the MoonRise venue in Brooklyn.
      source: https://luma.com/mo9nawaw
    - location_id: 5537
      expected_name: Tashca
      expected_description: Nolita event space hosting paint-and-sip nights, pop-ups, and creative gatherings.
      description: Tashca is a Portuguese restaurant and tavern at 151 Elizabeth Street in Nolita, serving shared dishes and hosting private dinners and occasional creative events.
      source: https://tashcanyc.com/
    - location_id: 7052
      expected_name: The Harvest Room
      expected_description: null
      description: The Harvest Room is Greater Jamaica Development Corporation’s rental event venue at 90-40 160th Street in Jamaica, Queens. Its flexible room, stage, dance floor, and garden accommodate celebrations, meetings, and community gatherings.
      source: https://gjdc.org/community-engagement/harvest-room/
    - location_id: 7488
      expected_name: Oblique Table
      expected_description: creative workshop/event space, Murray Hill
      description: Oblique Table is a creative studio and gathering space in Midtown Manhattan offering hands-on craft workshops, artist-led sessions, and community activities.
      source: https://www.obli.nyc/story
    - location_id: 8757
      expected_name: Brooklyn Point
      expected_description: Downtown Brooklyn residential tower at City Point whose amenity floors host ticketed chef residencies and multi-course pop-up tasting dinners open to the public.
      description: Brooklyn Point’s communal demonstration kitchen and chef’s counter at 138 Willoughby Street host Resident’s ticketed chef dinners and private dining events. The dining venue is inside a residential building; attendance is by reservation or invitation.
      source: https://www.meetresident.com/brooklyn-point
    - location_id: 9117
      expected_name: One Manhattan Square
      expected_description: An 800-foot residential tower on the East River waterfront at the foot of the Manhattan Bridge, with an extensive amenity floor and private lounges. Its event spaces host chef-hosted dinners and live-music evenings booked through Resident.
      description: One Manhattan Square’s communal demonstration kitchen and lounge at 225 Cherry Street host Resident’s chef dinners, receptions, and private dining events. The venue is inside a residential building; attendance is by reservation or invitation.
      source: https://www.meetresident.com/one-manhattan-square
    - location_id: 7384
      expected_name: Backyard BK
      expected_description: Indoor/outdoor event venue on 5th Avenue in Greenwood Heights hosting day parties and social events.
      description: Backyard Bar & Billiards is a South Slope sports bar at 740 Fifth Avenue in Brooklyn, hosting sports viewing, social events, and private gatherings.
      source: https://backyardbarandbilliards.com/williamsburg
    - location_id: 6500
      expected_name: Mambroso
      expected_description: Flatiron event space at 14 W 23rd St hosting tech-week parties and vinyl listening nights.
      description: Event address at 14 West 23rd Street in the Flatiron District, previously used for Mambroso gatherings. Mambroso is an organizer whose events take place at multiple venues; a specific permanent venue operator at this address has not been established.
      source: https://luma.com/mambroso
    - location_id: 7002
      expected_name: The Walker Loft
      expected_description: Versatile event and performance space on the 5th and 6th floors of 120 Walker Street, hosting theater, classes, film screenings, parties, weddings, and private events.
      description: The Walker Loft is an event and performance venue at 120 Walker Street, 5th Floor, hosting theater, classes, film screenings, weddings, and private gatherings.
      source: https://www.thewalkerloft.com/play
