# fomo.london configuration — regenerated from config/nyc.yaml (upstream catch-up
# merge) with London overrides re-applied. City-agnostic taxonomy sections
# (tag_scopes, tag_hierarchy, venue_taxonomy, frontend.filter_roots/venue_selector)
# are inherited verbatim from nyc.yaml. NYC-geographic sections (geographic_hierarchy,
# frontend.area_ids, frontend.neighborhood_selector) are intentionally omitted —
# build.js defaults them to {} (the neighborhood filter is empty until a London
# version is authored). London values: branding, map, timezone, extraction prompts,
# geotags, coverage, processor tokens, review places.

