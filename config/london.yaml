# Geographic coverage area. Read via city_config.coverage().
#
# SCOPE: this block is REVIEW-ONLY. It is not consumed by the crawl/extract/export
# pipeline — the pipeline's geographic gate is extraction.region_rule (sent to Gemini)
# plus the frontend map view. coverage() is read solely by a CoverageArea helper used
# by scripts/find_review_candidates.py to flag likely out-of-region events for manual
# culling. So leaving it US-shaped does NOT affect what gets crawled, mapped, or shown.
#
# CAVEAT: CoverageArea lives in find_out_of_area_events.py, which is NOT shipped in the
# public repo — so the coverage-dependent arms of find_review_candidates.py currently
# ImportError (true upstream for NYC too). Nothing to fix for launch.
#
# FOLLOW-UP (only if you later want out-of-region review tooling): write a UK
# CoverageArea that classifies by postcode outward code instead of US "<ST> <ZIP>".
# `zip3` is intentionally empty to disable the US path; `postcode_areas` documents the
# intended UK coverage for that future work; `bbox` is the coarse lat/lng fallback.
coverage:
  zip3: {}   # US-only path disabled for London — see FOLLOW-UP above.
  # UK outward-code AREAS that make up Greater London (for the future UK classifier).
  postcode_areas:
    - "EC"   # City of London
    - "WC"   # Holborn / Covent Garden
    - "E"    # East London
    - "N"    # North London
    - "NW"   # North West London
    - "SE"   # South East London
    - "SW"   # South West London
    - "W"    # West London
    # Outer London (partial areas — refine to district level when porting):
    - "BR"   # Bromley
    - "CR"   # Croydon
    - "DA"   # Dartford/Bexley (London part)
    - "EN"   # Enfield (London part)
    - "HA"   # Harrow
    - "IG"   # Ilford/Redbridge
    - "KT"   # Kingston (London part)
    - "RM"   # Romford/Havering
    - "SM"   # Sutton
    - "TW"   # Twickenham/Hounslow (London part)
    - "UB"   # Uxbridge/Hillingdon
    - "WD"   # Watford (London fringe — trim beyond M25 when porting)
  # Coarse lat/lng envelope, used when an address has no parseable postcode.
  # Roughly the M25 / Greater London boundary.
  bbox:
    min_lat: 51.26    # southern edge (Croydon / Bromley)
    max_lat: 51.72    # northern edge (Enfield / Barnet)
    min_lng: -0.56    # western edge (Hillingdon / Heathrow)
    max_lng: 0.33     # eastern edge (Havering / Upminster)

processor:
  # processor.py normalize_location_name — trailing region suffixes stripped.
  state_suffixes: [" london", " uk", " united kingdom", " england", " greater london"]
  # processor.py normalize_location_name — bare area names that collapse to "" (too generic).
  city_area_tokens:
    - "london"
    - "greater london"
    - "central london"
    - "city of london"
    - "the city"
    - "west end"
    - "east london"
    - "north london"
    - "south london"
    - "west london"
  # processor.py has_dash_before_borough — borough subset used to detect "<thing> - <borough>".
  borough_tokens:
    - "camden"
    - "hackney"
    - "islington"
    - "westminster"
    - "southwark"
    - "lambeth"
    - "tower hamlets"
    - "greenwich"
    - "wandsworth"
    - "kensington and chelsea"
    - "hammersmith and fulham"
  # processor.py — standalone region token stripped from tag / short_name (e.g. "London Comedy" -> "Comedy").
  region_tag_token: "London"
  # processor.py address parsing. These values are unioned straight into
  # processor._ADDR_STREET_TYPES, which recognises the street part of an address so
  # the pipeline can match/dedupe locations (quality only — it never filters events).
  # The base set already covers Road, Lane, Avenue, Square, Place, Court, Drive, Way,
  # Terrace, Street (via processor._ADDR_LONG_TO_SHORT), so we only add the UK types
  # the base set lacks, plus central-London street NAMES that carry no type suffix
  # (mirrors NYC's Broadway/Bowery).
  address:
    extra_street_types:
      # UK generic street types missing from the base (US) set:
      - "mews"
      - "crescent"
      - "grove"
      - "gardens"
      - "close"
      - "row"
      - "walk"
      - "hill"
      - "rise"
      - "parade"
      - "wharf"
      - "embankment"
      - "gate"
      - "green"
      - "villas"
      - "vale"
      # Typeless central-London street names (behave like a street type on their own):
      - "strand"
      - "whitehall"
      - "aldwych"
      - "haymarket"
      - "cheapside"
      - "piccadilly"
      - "pall mall"
    # Names that can stand alone with no preceding name word ("150 Strand").
    standalone_street_names: ["strand", "whitehall", "piccadilly", "aldwych", "haymarket", "cheapside"]

review:
  # scripts/find_review_candidates.py NON_REGION_PLACES — names that, in an event's
  # location_name, suggest it is outside Greater London. Word-boundary matched.
