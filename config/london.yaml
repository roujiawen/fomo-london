# fomo.london — city/region configuration
#
# London fork of config/nyc.yaml. This is the single file holding every
# London-specific string the backend engine needs. The engine reads it via
# pipeline/city_config.py (config/<FOMO_CITY>.yaml). Activate with:
#   export FOMO_CITY=london            # backend (pipeline)
#   FOMO_CITY=london npm run build     # frontend (build.js)
#
# See .claude/rules/city-config.md and .claude/rules/build-system.md for how each
# field is consumed. Fields mirror config/nyc.yaml one-for-one.

city_name: "London"
city_short: "London"
metro_name: "Greater London"

# Frontend config — injected into the built site by build.js (window.__CITY__ for the
# JS bundle + {{TOKEN}} branding replacement in src/index.html). See build.js.
frontend:
  site_name: "Fomo London"        # <title>, logo alt, search placeholder, menu
  domain: "fomo.london"           # branding TEXT only ("Search fomo.london"), NOT a live URL.
                                  # Safe to keep as the intended permanent name while you
                                  # run on a temp domain — all asset/API links are relative.
  emoji: "🎡"                      # menu / feedback decoration (London Eye)
  timezone: "Europe/London"       # utils.js: "today" + event-time parsing
  sw_enabled: true                # offline service worker (false emits a self-unregistering sw.js)
  # Full welcome-modal body (HTML), injected verbatim into #welcome-modal .modal-body.
  welcome_modal: |
    <ul>
        <li><span class="emoji-bullet">🎡</span><span><strong>Fomo London</strong> is a map of upcoming events in the Greater London area.</span></li>
        <li><span class="emoji-bullet">🤖</span><span>Events are collected automatically from many different websites every day.</span></li>
        <li><span class="emoji-bullet">💖</span><span>This project is a labor of love and will always be free and open-source.</span></li>
    </ul>
  map:
    center: [51.5074, -0.1278]     # [lat, lng] initial map view (central London)
    zoom: 11

extraction:
  # extractor.py get_chunk_prompt — the full opening line. {date} is substituted.
  chunk_intro: "Today's date is {date}. Extract ALL events from this London events page content."
  # extractor.py get_prompt — the full opening line. {date}, {name}, {url} are substituted.
  intro: "Today's date is {date}. We are assembling a database of upcoming events in London. Currently, we are inspecting {name} ({url})."
  # extractor.py get_prompt hashtag-guidance tail.
  tag_avoidance: "Avoid location-specific or London-redundant tags."
  # extractor.py get_prompt: the full metro-geography rule bullet (verbatim).
  # This prose is the extractor's FIRST filter — an event this rule tells Gemini to
  # skip is dropped before any coverage test runs, so keep it aligned with the
  # coverage: block below.
  region_rule: "Only include events in the Greater London area within the next 3 months. Greater London covers the City of London and all 32 London boroughs within the M25 (Travelcard Zones 1-6): Westminster, Camden, Islington, Hackney, Tower Hamlets, Southwark, Lambeth, Wandsworth, Kensington & Chelsea, Hammersmith & Fulham, Greenwich, Lewisham, Newham, Haringey, Brent, Ealing, Hounslow, Richmond upon Thames, Kingston upon Thames, Merton, Sutton, Croydon, Bromley, Bexley, Barking & Dagenham, Havering, Redbridge, Waltham Forest, Enfield, Barnet, Harrow, and Hillingdon. Skip events at venues outside Greater London (e.g. Brighton, Oxford, Cambridge, Reading, Watford beyond the M25, Birmingham, Manchester, Paris, or elsewhere)."

# db.py _load_generic_location_names() — city-level names added on top of the geotags list below.
generic_location_names:
  - "london"
  - "greater london"
  - "central london"
  - "city of london"
  - "the city"
  - "uk"
  - "united kingdom"

# Geographic "geotag" names (boroughs, neighbourhoods, districts, parks) across
# Greater London. Two city-agnostic consumers read this one list:
#   - Backend: city_config.geotags() -> db.py _load_generic_location_names treats
#     them as generic (too-vague-to-be-a-venue) location names, triggering a
#     detail crawl to find the specific venue.
#   - Frontend: build.js writes them into the generated src/data/tags.json, which
